<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mirissa Point live camera</title>
  <style>
    html,body{margin:0;width:100%;height:100%;background:#000}
    video{display:block;width:100%;height:100%;object-fit:cover}
    button{position:absolute;top:14px;left:14px;padding:9px 12px;border:0;border-radius:8px;background:rgba(0,0,0,.5);color:#fff;font:600 12px Arial;cursor:pointer}
    button[hidden]{display:none}
  </style>
</head>
<body>
  <video id="video" controls autoplay muted playsinline></video>
  <button id="status" type="button">Connecting</button>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const video = document.getElementById('video');
    const status = document.getElementById('status');
    const streamUrl = '/live/mirissapoint/index.m3u8';
    let hls = null;
    let retryCount = 0;
    let retryTimer = null;
    let awaitingTap = false;

    function playVideo() {
      video.play().catch(function () {
        awaitingTap = true;
        status.textContent = 'Tap to start';
        status.hidden = false;
      });
    }

    function scheduleRetry() {
      if (retryTimer) return;
      retryCount++;
      status.hidden = false;
      if (retryCount >= 3) {
        awaitingTap = true;
        status.textContent = 'Tap to reconnect';
        return;
      }
      status.textContent = 'Reconnecting';
      retryTimer = setTimeout(function () {
        retryTimer = null;
        startStream();
      }, 4000);
    }

    function startStream() {
      clearTimeout(retryTimer);
      retryTimer = null;
      awaitingTap = false;
      status.hidden = false;
      status.textContent = 'Connecting';
      if (hls) { hls.destroy(); hls = null; }
      // Match the working LankaSwell camera page: hls.js first,
      // using the same small buffer and same-origin stream URL.
      if (window.Hls && Hls.isSupported()) {
        if (window.ManagedMediaSource) video.disableRemotePlayback = true;
        hls = new Hls({enableWorker:true,lowLatencyMode:false,maxBufferLength:10,backBufferLength:5});
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, playVideo);
        hls.on(Hls.Events.ERROR, function (_event, data) {
          if (data.fatal) scheduleRetry();
        });
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
        playVideo();
      } else {
        status.textContent = 'Playback unavailable';
      }
    }

    video.addEventListener('playing', function () {
      clearTimeout(retryTimer);
      retryTimer = null;
      retryCount = 0;
      awaitingTap = false;
      status.hidden = true;
    });
    video.addEventListener('error', scheduleRetry);
    status.addEventListener('click', function () {
      if (!awaitingTap) return;
      retryCount = 0;
      if (video.error || !video.src && !hls || status.textContent === 'Tap to reconnect') startStream();
      else playVideo();
    });
    startStream();
  </script>
</body>
</html>
