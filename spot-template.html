<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LankaSwell has become LankaSurf. Find Sri Lanka surf cameras, forecasts and guides at lankasurf.com.">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#092630">
  <title>LankaSwell is now LankaSurf</title>
  <link rel="canonical" href="https://lankasurf.com/">
  <link rel="icon" href="img/favicon-32x32.png" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: dark; font-family: "DM Sans", Arial, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100svh; color: #fff; background: #092630; }
    main { min-height: 100vh; min-height: 100svh; display: grid; place-items: center; padding: 32px 20px; position: relative; isolation: isolate; }
    main::before { content: ""; position: absolute; inset: 0; z-index: -2; background: url("img/background.webp") center / cover no-repeat; }
    main::after { content: ""; position: absolute; inset: 0; z-index: -1; background: linear-gradient(125deg, rgba(3, 30, 40, .82), rgba(3, 30, 40, .49)), linear-gradient(0deg, rgba(3, 30, 40, .42), transparent 55%); }
    .card { width: min(100%, 650px); padding: clamp(30px, 6vw, 60px); text-align: center; background: rgba(7, 39, 48, .83); border: 1px solid rgba(255, 255, 255, .22); border-radius: 24px; box-shadow: 0 24px 80px rgba(0, 0, 0, .25); backdrop-filter: blur(12px); }
    .eyebrow { margin: 0 0 23px; color: #b6d9dc; text-transform: uppercase; letter-spacing: .19em; font-size: .76rem; font-weight: 700; }
    .old-name { margin: 0; color: #d0e4e4; font-size: clamp(1rem, 2.8vw, 1.2rem); font-weight: 600; }
    .arrow { display: block; margin: 15px auto; color: #7ce0d2; font-size: 1.5rem; line-height: 1; }
    .brand { display: flex; justify-content: center; align-items: center; gap: 13px; margin: 0; font-family: Oswald, Impact, sans-serif; font-size: clamp(2.6rem, 9vw, 5rem); line-height: 1.1; font-weight: 600; letter-spacing: .035em; text-transform: uppercase; }
    .brand img { width: clamp(36px, 8vw, 57px); height: auto; }
    .message { max-width: 440px; margin: 25px auto 29px; color: #e1eded; font-size: clamp(1rem, 2.5vw, 1.15rem); line-height: 1.65; }
    .button { display: inline-flex; justify-content: center; align-items: center; min-height: 54px; padding: 13px 27px; border-radius: 10px; background: #f5faf6; color: #0a3037; font-weight: 700; text-decoration: none; transition: background .2s, transform .2s; }
    .button:hover { background: #baf2e7; transform: translateY(-2px); }
    .button:focus-visible { outline: 3px solid #8be8d8; outline-offset: 4px; }
    .address { margin: 17px 0 0; color: #b6d9dc; font-size: .9rem; }
    @media (max-width: 450px) { .card { padding: 36px 23px; } .brand { gap: 8px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="new-name">
      <p class="eyebrow">A new name. The same ocean.</p>
      <p class="old-name">LankaSwell has become</p>
      <span class="arrow" aria-hidden="true">↓</span>
      <h1 class="brand" id="new-name"><img src="img/lankasurf-dot.svg" alt="">Lanka Surf</h1>
      <p class="message">Our surf cameras, forecasts and guides have a new home. Come find us at LankaSurf.</p>
      <a class="button" href="https://lankasurf.com/">Go to LankaSurf <span aria-hidden="true">&nbsp;↗</span></a>
      <p class="address">lankasurf.com</p>
    </section>
  </main>
</body>
</html>
